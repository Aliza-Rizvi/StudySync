spring.application.name=studysync
server.port=8080

# ---------- MySQL connection ----------
# The database "studysync_db" is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/studysync_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Karachi
spring.datasource.username=root
# All 3 members use the SAME MySQL root password so this file never changes
spring.datasource.password=studysync123

# ---------- JPA / Hibernate ----------
# "update" = Hibernate creates and updates the tables from our @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---------- Thymeleaf ----------
# false = page changes show after a browser refresh (no restart needed)
spring.thymeleaf.cache=false