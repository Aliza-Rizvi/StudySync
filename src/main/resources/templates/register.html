<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="ss-auth">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="text-center mb-4 mt-4">
                <h1 class="fw-bold ss-brand">StudySync</h1>
                <p class="text-muted">Create your student account</p>
            </div>
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div th:replace="~{fragments/layout :: alerts}"></div>
                    <div id="formError" class="alert alert-danger d-none"></div>
                    <form id="registerForm" th:action="@{/register}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="fullName">Full name</label>
                            <input class="form-control" id="fullName" name="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">University email</label>
                            <input class="form-control" type="email" id="email" name="email" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="sapId">SAP ID</label>
                                <input class="form-control" id="sapId" name="sapId">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="semester">Semester</label>
                                <input class="form-control" type="number" min="1" max="8" id="semester" name="semester" value="1">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="department">Department</label>
                            <input class="form-control" id="department" name="department" placeholder="Software Engineering">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="password">Password (6+ characters)</label>
                                <input class="form-control" type="password" id="password" name="password" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="confirmPassword">Confirm password</label>
                                <input class="form-control" type="password" id="confirmPassword" required>
                            </div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Create account</button>
                    </form>
                    <p class="mt-3 mb-0 text-center">Already registered? <a th:href="@{/login}">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
