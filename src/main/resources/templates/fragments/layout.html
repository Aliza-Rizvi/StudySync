<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Shared pieces used by every page: <head>, navbar, alert messages, scripts -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' | StudySync'}">StudySync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark ss-navbar mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}" th:text="${appName}">StudySync</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav" th:if="${currentStudent != null}">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/partners}">Find Partners</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/groups}">Groups</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/history}">Sessions</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/availability}">Availability</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/profile}">Profile</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/notifications}">
                        Notifications
                        <span class="badge bg-warning text-dark" th:if="${unreadCount != null and unreadCount > 0}"
                              th:text="${unreadCount}">3</span>
                    </a>
                </li>
                <li class="nav-item"><span class="nav-link text-white-50" th:text="${currentStudent.fullName}">Name</span></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="alerts">
    <div class="alert alert-success alert-dismissible fade show" th:if="${success}">
        <span th:text="${success}">Saved</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${error}">
        <span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
