<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Availability')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h2 class="mb-1">My Availability</h2>
    <p class="text-muted mb-4">Add the times you are free every week. Matching uses these slots.</p>
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header fw-semibold">Add free time</div>
                <div class="card-body">
                    <form th:action="@{/availability}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="day">Day</label>
                            <select class="form-select" id="day" name="day">
                                <option th:each="d : ${days}" th:value="${d}" th:text="${#strings.capitalize(#strings.toLowerCase(d))}">Monday</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="startTime">From</label>
                            <input class="form-control" type="time" id="startTime" name="startTime" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="endTime">To</label>
                            <input class="form-control" type="time" id="endTime" name="endTime" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Add slot</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header fw-semibold">Weekly free time</div>
                <table class="table mb-0">
                    <thead><tr><th>Day</th><th>From</th><th>To</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="slot : ${slots}">
                        <td th:text="${slot.dayLabel}">Monday</td>
                        <td th:text="${#temporals.format(slot.startTime, 'hh:mm a')}">10:00</td>
                        <td th:text="${#temporals.format(slot.endTime, 'hh:mm a')}">12:00</td>
                        <td class="text-end">
                            <form th:action="@{/availability/{id}/delete(id=${slot.id})}" method="post">
                                <button class="btn btn-sm btn-outline-danger" data-confirm="Remove this time slot?">Remove</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(slots)}"><td colspan="4" class="text-muted">No free time added yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
