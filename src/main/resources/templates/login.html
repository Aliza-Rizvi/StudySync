<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="ss-auth">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4 mt-5">
                <h1 class="fw-bold ss-brand">StudySync</h1>
                <p class="text-muted">Smart Study Group Finder and Planner</p>
            </div>
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="mb-3">Login</h4>
                    <div th:replace="~{fragments/layout :: alerts}"></div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="email">University email</label>
                            <input class="form-control" type="email" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" type="password" id="password" name="password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Login</button>
                    </form>
                    <p class="mt-3 mb-0 text-center">New here? <a th:href="@{/register}">Create an account</a></p>
                </div>
            </div>
            <p class="text-center text-muted small mt-3">Demo account: ali@demo.com / demo123</p>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
